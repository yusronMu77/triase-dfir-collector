[project]
name = "astria-collector"
version = "0.1.0"
description = "Collector (A11): program operator Windows untuk pengumpulan dari host dan USB/AndroidQF."
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic==2.14.3", "pydantic-settings==2.16.2", "httpx==0.28.1",
  "tenacity==9.2.1", "structlog==26.1.0",
]

[project.scripts]
astria-collector = "astria_collector.__main__:main"

[dependency-groups]
dev = [
  "pyinstaller==6.22.3", "pytest==9.2.0", "hypothesis==6.170.15",
  "ruff==0.17.4", "pyright==1.1.414", "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astria_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
